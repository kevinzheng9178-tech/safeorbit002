[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "safeorbit"
version = "0.5.0"
description = "SafeOrbit - Agent 运行轨迹审计与治理"
requires-python = ">=3.9"
dependencies = [
    "pydantic>=2.0",
    "PyYAML>=6.0",
    "httpx>=0.28.1,<0.29",
    "httpcore>=1.0.9,<1.1",
    "anyio>=4.12.1,<4.13",
    "fastapi>=0.100",
    "uvicorn>=0.20",
    "python-multipart>=0.0.9",
]

[project.optional-dependencies]
dev = ["pytest>=7.0", "ruff>=0.6", "mypy>=1.10"]

[project.scripts]
safeorbit = "safeorbit.cli:main"

[tool.setuptools]
packages = ["safeorbit", "safeorbit.importers", "safeorbit.rules"]

[tool.setuptools.package-data]
safeorbit = ["pricing.yaml", "advisories.json", "assets/*.svg"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 120
target-version = "py39"
exclude = [".venv", "reports", "data"]

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I", "W"]
ignore = ["E501"]

[tool.mypy]
python_version = "3.9"
ignore_missing_imports = true
warn_unused_ignores = false
check_untyped_defs = false
