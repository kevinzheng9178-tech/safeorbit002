name: ci

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: |
            requirements.txt
            constraints.txt
      - name: 安装依赖
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt -c constraints.txt
          pip install pytest ruff
          pip install --no-deps -e .
      - name: 语法检查
        run: python -m compileall -q safeorbit
      - name: 静态检查（仅语法级规则，避免存量告警淹没信号）
        run: ruff check --select E9,F63,F7,F82 safeorbit
      - name: 运行测试
        run: python -m pytest -q
      - name: 构建镜像
        run: docker build -t safeorbit:ci .
