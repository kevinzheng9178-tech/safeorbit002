<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 240 240" width="240" height="240" role="img" aria-label="SafeOrbit 安轨 · 图形标识">
  <title>SafeOrbit 安轨 · 图形标识</title>
  <desc>透明底版本：装甲分面盾牌 + 负空间对勾，外围三道轨道与闸门、交接、证据节点。</desc>
  <defs>
    <linearGradient id="so-mark-ring" x1="0.1" y1="0.1" x2="0.9" y2="0.9">
      <stop offset="0" stop-color="#65D6C1"/>
      <stop offset="1" stop-color="#B4A5E8"/>
    </linearGradient>
    <linearGradient id="so-mark-face-light" x1="0.15" y1="0" x2="0.7" y2="1">
      <stop offset="0" stop-color="#D6FFF4"/>
      <stop offset="0.45" stop-color="#8DEDD8"/>
      <stop offset="1" stop-color="#3FAF99"/>
    </linearGradient>
    <linearGradient id="so-mark-face-mid" x1="0.3" y1="0" x2="0.9" y2="1">
      <stop offset="0" stop-color="#6FE3CB"/>
      <stop offset="0.55" stop-color="#3CB49E"/>
      <stop offset="1" stop-color="#1D6358"/>
    </linearGradient>
    <radialGradient id="so-mark-glow" cx="50%" cy="46%" r="52%">
      <stop offset="0" stop-color="#65D6C1" stop-opacity="0.22"/>
      <stop offset="1" stop-color="#65D6C1" stop-opacity="0"/>
    </radialGradient>
    <filter id="so-mark-shield-glow" x="-45%" y="-45%" width="190%" height="190%">
      <feGaussianBlur stdDeviation="7"/>
    </filter>
    <mask id="so-mark-shield-cut">
      <rect width="240" height="240" fill="#FFFFFF"/>
      <path d="M104 113 L116 126 L137 99" fill="none" stroke="#000000" stroke-width="10"
            stroke-linecap="round" stroke-linejoin="round"/>
    </mask>
  </defs>

  <circle cx="120" cy="120" r="96" fill="url(#so-mark-glow)"/>

  <path d="M166 40.3 A92 92 0 1 1 60.9 49.5" fill="none"
        stroke="url(#so-mark-ring)" stroke-width="5" stroke-linecap="round"/>
  <circle cx="120" cy="120" r="66" fill="none"
          stroke="#65D6C1" stroke-opacity="0.42" stroke-width="2.5" stroke-dasharray="3 9"/>
  <circle cx="120" cy="120" r="50" fill="none"
          stroke="#E6ECEF" stroke-opacity="0.22" stroke-width="2.5"
          stroke-dasharray="46 32" transform="rotate(10 120 120)"/>

  <path d="M120 72 L154 86 V118 L146 136 L134 149 L120 161 L106 149 L94 136 L86 118 V86 Z"
        fill="#65D6C1" fill-opacity="0.45" filter="url(#so-mark-shield-glow)"/>

  <g mask="url(#so-mark-shield-cut)">
    <path d="M120 72 L86 86 V118 L94 136 L106 149 L120 161 Z" fill="url(#so-mark-face-light)"/>
    <path d="M120 72 L154 86 V118 L146 136 L134 149 L120 161 Z" fill="url(#so-mark-face-mid)"/>
    <path d="M120 72 L154 86 V97 L120 83 L86 97 V86 Z" fill="#EFFFFB" fill-opacity="0.22"/>
    <path d="M120 72 V96" stroke="#08211D" stroke-opacity="0.5" stroke-width="2" stroke-linecap="round"/>
    <path d="M120 138 V161" stroke="#08211D" stroke-opacity="0.5" stroke-width="2" stroke-linecap="round"/>
  </g>

  <path d="M120 72 L154 86 V118 L146 136 L134 149 L120 161 L106 149 L94 136 L86 118 V86 Z"
        fill="none" stroke="#D6FFF4" stroke-opacity="0.6" stroke-width="1.8" stroke-linejoin="round"/>

  <circle cx="166" cy="40.3" r="7" fill="#65D6C1"/>
  <circle cx="60.9" cy="49.5" r="5" fill="#B4A5E8"/>
  <circle cx="210.6" cy="136" r="4" fill="#EDC279"/>
</svg>
