<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 700 200" width="700" height="200" role="img" aria-label="SafeOrbit 安轨">
  <title>SafeOrbit 安轨</title>
  <desc>SafeOrbit 安轨横向组合标识：装甲分面盾牌 + 三道轨道 + 字标。</desc>
  <defs>
    <linearGradient id="so-h-ring" x1="0.1" y1="0.1" x2="0.9" y2="0.9">
      <stop offset="0" stop-color="#65D6C1"/>
      <stop offset="1" stop-color="#B4A5E8"/>
    </linearGradient>
    <linearGradient id="so-h-face-light" x1="0.15" y1="0" x2="0.7" y2="1">
      <stop offset="0" stop-color="#D6FFF4"/>
      <stop offset="0.45" stop-color="#8DEDD8"/>
      <stop offset="1" stop-color="#3FAF99"/>
    </linearGradient>
    <linearGradient id="so-h-face-mid" x1="0.3" y1="0" x2="0.9" y2="1">
      <stop offset="0" stop-color="#6FE3CB"/>
      <stop offset="0.55" stop-color="#3CB49E"/>
      <stop offset="1" stop-color="#1D6358"/>
    </linearGradient>
    <radialGradient id="so-h-glow" cx="50%" cy="46%" r="52%">
      <stop offset="0" stop-color="#65D6C1" stop-opacity="0.2"/>
      <stop offset="1" stop-color="#65D6C1" stop-opacity="0"/>
    </radialGradient>
    <filter id="so-h-shield-glow" x="-45%" y="-45%" width="190%" height="190%">
      <feGaussianBlur stdDeviation="6"/>
    </filter>
    <mask id="so-h-shield-cut">
      <rect width="240" height="240" fill="#FFFFFF"/>
      <path d="M104 113 L116 126 L137 99" fill="none" stroke="#000000" stroke-width="10"
            stroke-linecap="round" stroke-linejoin="round"/>
    </mask>
  </defs>

  <g transform="translate(16 16) scale(0.7)">
    <circle cx="120" cy="120" r="96" fill="url(#so-h-glow)"/>
    <path d="M166 40.3 A92 92 0 1 1 60.9 49.5" fill="none"
          stroke="url(#so-h-ring)" stroke-width="5" stroke-linecap="round"/>
    <circle cx="120" cy="120" r="66" fill="none"
            stroke="#65D6C1" stroke-opacity="0.42" stroke-width="2.5" stroke-dasharray="3 9"/>
    <circle cx="120" cy="120" r="50" fill="none"
            stroke="#E6ECEF" stroke-opacity="0.22" stroke-width="2.5"
            stroke-dasharray="46 32" transform="rotate(10 120 120)"/>

    <path d="M120 72 L154 86 V118 L146 136 L134 149 L120 161 L106 149 L94 136 L86 118 V86 Z"
          fill="#65D6C1" fill-opacity="0.45" filter="url(#so-h-shield-glow)"/>

    <g mask="url(#so-h-shield-cut)">
      <path d="M120 72 L86 86 V118 L94 136 L106 149 L120 161 Z" fill="url(#so-h-face-light)"/>
      <path d="M120 72 L154 86 V118 L146 136 L134 149 L120 161 Z" fill="url(#so-h-face-mid)"/>
      <path d="M120 72 L154 86 V97 L120 83 L86 97 V86 Z" fill="#EFFFFB" fill-opacity="0.22"/>
      <path d="M120 72 V96" stroke="#08211D" stroke-opacity="0.5" stroke-width="2" stroke-linecap="round"/>
      <path d="M120 138 V161" stroke="#08211D" stroke-opacity="0.5" stroke-width="2" stroke-linecap="round"/>
    </g>

    <path d="M120 72 L154 86 V118 L146 136 L134 149 L120 161 L106 149 L94 136 L86 118 V86 Z"
          fill="none" stroke="#D6FFF4" stroke-opacity="0.6" stroke-width="1.8" stroke-linejoin="round"/>

    <circle cx="166" cy="40.3" r="7" fill="#65D6C1"/>
    <circle cx="60.9" cy="49.5" r="5" fill="#B4A5E8"/>
    <circle cx="210.6" cy="136" r="4" fill="#EDC279"/>
  </g>

  <g font-family="'Segoe UI','Microsoft YaHei',Helvetica,Arial,sans-serif">
    <text x="210" y="96" font-size="62" font-weight="700" letter-spacing="-1">
      <tspan fill="#E6ECEF">Safe</tspan><tspan fill="#65D6C1">Orbit</tspan>
    </text>
    <text x="214" y="136" font-size="24" letter-spacing="10" fill="#9BA8B1">安轨</text>
    <text x="214" y="168" font-size="13" letter-spacing="3.4" fill="#65D6C1" fill-opacity="0.85">AGENT RUNTIME AUDIT &amp; GOVERNANCE</text>
  </g>
</svg>
